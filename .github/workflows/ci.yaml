name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: datum-cloud/actions/.github/workflows/ci-basic.yaml@v1.31.0
    with:
      # The controller tests need envtest's API server binaries, which
      # `make test` installs and plain `go test ./...` does not.
      skip: test
      run: make test
