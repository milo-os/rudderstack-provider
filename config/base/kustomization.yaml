apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CRDs, the manager and its RBAC. The controller-gen ClusterRole lives in
# ../components/controller_rbac so the binding in rbac/ names a real role.
resources:
  - crd
  - manager
  - rbac

components:
  - ../components/controller_rbac
