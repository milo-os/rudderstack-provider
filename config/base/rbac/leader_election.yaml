# Leader election in LEADER_ELECT_NAMESPACE's default, kube-system, limited to
# the provider's own Lease. The milo-integration component moves the Lease to
# Milo instead, where this Role is not used.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rudderstack-provider-leader-election
  namespace: kube-system
  labels:
    app.kubernetes.io/name: rudderstack-provider
    app.kubernetes.io/managed-by: kustomize
rules:
  # create cannot be limited by name, since the object does not exist yet.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["f98364c5.miloapis.com"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rudderstack-provider-leader-election
  namespace: kube-system
  labels:
    app.kubernetes.io/name: rudderstack-provider
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rudderstack-provider-leader-election
subjects:
  - kind: ServiceAccount
    name: rudderstack-provider
    namespace: rudderstack-provider-system
