# Leader election in LEADER_ELECT_NAMESPACE's default, kube-system. The
# milo-integration component moves the Lease to Milo instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rudderstack-provider-leader-election
  namespace: kube-system
  labels:
    app.kubernetes.io/name: rudderstack-provider
    app.kubernetes.io/managed-by: kustomize
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rudderstack-provider-leader-election
  namespace: kube-system
  labels:
    app.kubernetes.io/name: rudderstack-provider
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rudderstack-provider-leader-election
subjects:
  - kind: ServiceAccount
    name: rudderstack-provider
    namespace: rudderstack-provider-system
