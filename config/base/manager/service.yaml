apiVersion: v1
kind: Service
metadata:
  name: rudderstack-provider-metrics
  namespace: rudderstack-provider-system
  labels:
    control-plane: rudderstack-provider
    app.kubernetes.io/name: rudderstack-provider
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    control-plane: rudderstack-provider
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
