# Daily activity signals. Profiles derives "first datumctl access",
# "frequent datumctl user" and inactivity from these.
apiVersion: analytics.miloapis.com/v1alpha1
kind: TrackingRule
metadata:
  name: datumctl-used
spec:
  event: datumctl Used
  limit: OncePerDay
  match:
    verbs: [get, list, watch, create, update, patch, delete]
    conditions:
      # Conditions are ORed, so both checks share one expression. Machine
      # accounts (such as CI pipelines) using datumctl are not users.
      - name: human-datumctl
        expression: 'userAgent.startsWith("datumctl/") && actor.kind == "user"'
---
apiVersion: analytics.miloapis.com/v1alpha1
kind: TrackingRule
metadata:
  name: user-active
spec:
  event: Active
  limit: OncePerDay
  match:
    verbs: [get, list, watch, create, update, patch, delete]
    conditions:
      - name: human
        expression: 'actor.kind == "user"'
