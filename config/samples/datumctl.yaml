apiVersion: analytics.miloapis.com/v1alpha1
kind: TrackingRule
metadata:
  name: datumctl-first-access
spec:
  event: First datumctl Access
  match:
    verbs: [get, list, watch, create, update, patch, delete]
    conditions:
      - name: datumctl
        expression: userAgent.startsWith("datumctl/")
  trigger:
    type: Once
---
# "Frequent" is not defined yet: 5 distinct days in 14 is a placeholder.
apiVersion: analytics.miloapis.com/v1alpha1
kind: TrackingRule
metadata:
  name: datumctl-frequent-user
spec:
  event: Frequent datumctl User
  match:
    verbs: [get, list, watch, create, update, patch, delete]
    conditions:
      - name: datumctl
        expression: userAgent.startsWith("datumctl/")
  trigger:
    type: Frequency
    frequency:
      days: 5
      window: 336h
