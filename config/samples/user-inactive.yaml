apiVersion: analytics.miloapis.com/v1alpha1
kind: TrackingRule
metadata:
  name: user-inactive-14d
spec:
  event: User Inactive
  match:
    verbs: [get, list, watch, create, update, patch, delete]
    conditions:
      - name: human
        expression: '!user.username.startsWith("system:")'
  trigger:
    type: Inactivity
    inactivity:
      after: 336h
