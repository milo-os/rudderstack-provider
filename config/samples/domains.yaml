apiVersion: analytics.miloapis.com/v1alpha1
kind: TrackingRule
metadata:
  name: domain-added-first
spec:
  event: First Domain Added
  match:
    resource:
      group: networking.datumapis.com
      resource: domains
    verbs: [create]
    conditions:
      - name: human
        expression: '!user.username.startsWith("system:")'
  trigger:
    type: Once
  properties:
    - name: domain
      expression: objectRef.name
---
apiVersion: analytics.miloapis.com/v1alpha1
kind: TrackingRule
metadata:
  name: domains-added-user-over-3
spec:
  event: Domains Added Over 3
  match:
    resource:
      group: networking.datumapis.com
      resource: domains
    verbs: [create, delete]
  trigger:
    type: Threshold
    threshold:
      atLeast: 4
---
apiVersion: analytics.miloapis.com/v1alpha1
kind: TrackingRule
metadata:
  name: domains-added-org-over-10
spec:
  event: Organization Domains Over 10
  subject: Organization
  match:
    resource:
      group: networking.datumapis.com
      resource: domains
    verbs: [create, delete]
  trigger:
    type: Threshold
    threshold:
      atLeast: 11
---
apiVersion: analytics.miloapis.com/v1alpha1
kind: TrackingRule
metadata:
  name: domain-removed
spec:
  event: Domain Removed
  match:
    resource:
      group: networking.datumapis.com
      resource: domains
    verbs: [delete]
    conditions:
      - name: human
        expression: '!user.username.startsWith("system:")'
  trigger:
    type: Every
  properties:
    - name: domain
      expression: objectRef.name
