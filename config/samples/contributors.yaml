apiVersion: analytics.miloapis.com/v1alpha1
kind: TrackingRule
metadata:
  name: contributor-added
spec:
  event: Contributor Added
  subject: Organization
  match:
    resource:
      group: resourcemanager.miloapis.com
      resource: organizationmemberships
    verbs: [create]
    conditions:
      - name: human
        expression: '!user.username.startsWith("system:")'
  trigger:
    type: Every
---
apiVersion: analytics.miloapis.com/v1alpha1
kind: TrackingRule
metadata:
  name: contributors-org-over-10
spec:
  event: Organization Contributors Over 10
  subject: Organization
  match:
    resource:
      group: resourcemanager.miloapis.com
      resource: organizationmemberships
    verbs: [create, delete]
  trigger:
    type: Threshold
    threshold:
      atLeast: 11
