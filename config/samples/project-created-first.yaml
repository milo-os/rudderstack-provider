apiVersion: analytics.miloapis.com/v1alpha1
kind: TrackingRule
metadata:
  name: project-created-first
spec:
  event: First Project Created
  match:
    resource:
      group: resourcemanager.miloapis.com
      resource: projects
    verbs: [create]
    conditions:
      - name: human
        expression: '!user.username.startsWith("system:")'
  trigger:
    type: Once
