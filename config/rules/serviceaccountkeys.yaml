# A key is the credential a pipeline uses, so creating one is the clearest
# sign automation is actually being wired up. Milo audits keys at Metadata
# level so the private key never reaches the audit log; these rules read only
# objectRef and the request scope.
apiVersion: analytics.miloapis.com/v1alpha1
kind: TrackingRule
metadata:
  name: service-account-key-created
spec:
  event: Service Account Key Created
  match:
    resource:
      group: identity.miloapis.com
      resource: serviceaccountkeys
    verbs: [create]
  properties:
    - name: name
      expression: objectRef.name
    - name: namespace
      expression: objectRef.namespace
    - name: project
      expression: 'tenant.type in ["project", "Project"] ? tenant.name : ""'
    - name: changeSource
      expression: 'actor.kind == "user" ? "human" : actor.kind == "serviceaccount" ? "automation" : "system"'
---
apiVersion: analytics.miloapis.com/v1alpha1
kind: TrackingRule
metadata:
  name: service-account-key-deleted
spec:
  event: Service Account Key Deleted
  match:
    resource:
      group: identity.miloapis.com
      resource: serviceaccountkeys
    verbs: [delete]
  properties:
    - name: name
      expression: objectRef.name
    - name: namespace
      expression: objectRef.namespace
    - name: project
      expression: 'tenant.type in ["project", "Project"] ? tenant.name : ""'
    - name: changeSource
      expression: 'actor.kind == "user" ? "human" : actor.kind == "serviceaccount" ? "automation" : "system"'
