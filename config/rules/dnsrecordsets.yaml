# Records show a zone is in real use rather than created and left empty.
# Only create and delete: updates are frequent and say little.
#
# Records written by the platform itself are skipped on both sides: zone
# defaults from the DNS controller, records external-dns publishes for
# proxies, and their cleanup. In staging these were about 98% of record set
# events and say nothing about what a customer did. Both rules filter the
# same way so Added and Removed stay paired.
apiVersion: analytics.miloapis.com/v1alpha1
kind: TrackingRule
metadata:
  name: dns-record-set-added
spec:
  event: DNS Record Set Added
  match:
    resource:
      group: dns.networking.miloapis.com
      resource: dnsrecordsets
    verbs: [create]
    conditions:
      - name: not-platform
        expression: 'actor.kind != "system"'
  properties:
    - name: name
      expression: objectRef.name
    - name: namespace
      expression: objectRef.namespace
    - name: project
      expression: 'tenant.type in ["project", "Project"] ? tenant.name : ""'
    - name: changeSource
      expression: 'actor.kind == "user" ? "human" : actor.kind == "serviceaccount" ? "automation" : "system"'
---
apiVersion: analytics.miloapis.com/v1alpha1
kind: TrackingRule
metadata:
  name: dns-record-set-removed
spec:
  event: DNS Record Set Removed
  match:
    resource:
      group: dns.networking.miloapis.com
      resource: dnsrecordsets
    verbs: [delete]
    conditions:
      - name: not-platform
        expression: 'actor.kind != "system"'
  properties:
    - name: name
      expression: objectRef.name
    - name: namespace
      expression: objectRef.namespace
    - name: project
      expression: 'tenant.type in ["project", "Project"] ? tenant.name : ""'
    - name: changeSource
      expression: 'actor.kind == "user" ? "human" : actor.kind == "serviceaccount" ? "automation" : "system"'
