# Service accounts are how customers automate against Datum (CI pipelines,
# servers). Feeds automation-adoption milestones.
apiVersion: analytics.miloapis.com/v1alpha1
kind: TrackingRule
metadata:
  name: service-account-created
spec:
  event: Service Account Created
  match:
    resource:
      group: iam.miloapis.com
      resource: serviceaccounts
    verbs: [create]
  properties:
    - name: name
      expression: objectRef.name
    - name: namespace
      expression: objectRef.namespace
    - name: project
      expression: 'tenant.type in ["project", "Project"] ? tenant.name : ""'
    - name: changeSource
      expression: 'actor.kind == "user" ? "human" : actor.kind == "serviceaccount" ? "automation" : "system"'
---
apiVersion: analytics.miloapis.com/v1alpha1
kind: TrackingRule
metadata:
  name: service-account-deleted
spec:
  event: Service Account Deleted
  match:
    resource:
      group: iam.miloapis.com
      resource: serviceaccounts
    verbs: [delete]
  properties:
    - name: name
      expression: objectRef.name
    - name: namespace
      expression: objectRef.namespace
    - name: project
      expression: 'tenant.type in ["project", "Project"] ? tenant.name : ""'
    - name: changeSource
      expression: 'actor.kind == "user" ? "human" : actor.kind == "serviceaccount" ? "automation" : "system"'
